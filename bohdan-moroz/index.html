<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мороз Богдан Зіновійович — Вічна пам'ять</title>
<meta name="description" content="Меморіальна сторінка захисника України Мороз Богдан Зіновійович. Вічна пам'ять герою.">

<meta property="og:type" content="profile">
<meta property="og:title" content="Мороз Богдан Зіновійович — Вічна пам'ять">
<meta property="og:description" content="Захисник України. Вічна пам'ять герою.">
<meta property="og:image" content="photo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="hero">
  <div class="flag">
    <span class="mourning"></span>
  </div>

  <div class="wrap hero-body">
    <div class="portrait">
      <img src="photo.jpg" alt="Богдан Мороз"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="placeholder" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </div>
    </div>

    <h1 class="name">Мороз Богдан Зіновійович</h1>
    <p class="rank">Захисник України</p>

    <div class="flag-underline"><span class="b"></span><span class="y"></span></div>
  </div>
</header>

<main class="wrap">

  <div class="divider"><span class="diamond"></span></div>

  <section class="pending">
    <p class="lead">Вічна пам'ять і безмежна вдячність Герою.</p>
    <p>Інформація про життєвий і бойовий шлях воїна уточнюється й буде додана згодом.</p>
    <div class="candle">
      <svg width="44" height="64" viewBox="0 0 44 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g class="flame">
          <path d="M22 6c4 5 6 8 6 12a6 6 0 1 1-12 0c0-2 1.2-4 3-6 .6 2 2 3 3 4 .4-3-1-7-0-10z" fill="#e0b73f"/>
          <path d="M22 12c2 3 3 5 3 7a3 3 0 1 1-6 0c0-2 1.4-4 3-7z" fill="#fff3cf"/>
        </g>
        <rect x="17" y="26" width="10" height="32" rx="2" fill="#e9e5dc"/>
        <rect x="17" y="26" width="4" height="32" rx="2" fill="#fff" opacity="0.35"/>
      </svg>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <div class="foot-flag"><span class="b"></span><span class="y"></span></div>
    Мороз Богдан Зіновійович<br>
    Герой не вмирає, поки живе пам'ять.
    <a class="back" href="../">← Усі імена</a>
  </div>
</footer>

</body>
</html>
