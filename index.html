<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вічна пам'ять — Захисники України</title>
<meta name="description" content="Меморіальні сторінки полеглих захисників України. Вічна пам'ять героям.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="index-hero">
  <div class="flag"><span class="mourning"></span></div>
  <div class="wrap index-body">
    <h1>Вічна пам'ять</h1>
    <p>Захисникам України, які віддали життя за свободу та майбутнє нашої держави.</p>
  </div>
</header>

<main class="wrap">
  <div class="roll">

    <a class="card" href="serhii-ulitych/">
      <img src="serhii-ulitych/photo.jpg" alt="Сергій Улітич"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph'}))">
      <div class="info">
        <h2>Сергій Улітич</h2>
        <span class="d">23 квітня 1998 — 17 травня 2026</span>
      </div>
    </a>

  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-flag"><span class="b"></span><span class="y"></span></div>
    Герой не вмирає, поки живе пам'ять.
  </div>
</footer>

</body>
</html>
